workflows:
  essax-android:
    name: Essax Android
    max_build_duration: 30
    instance_type: linux_x2
    environment:
      flutter: 3.35.7
    scripts:
      - name: Get packages
        script: flutter pub get
      - name: Build Android App Bundle
        script: flutter build appbundle --debug
    artifacts:
      - build/**/outputs/**/*.aab
