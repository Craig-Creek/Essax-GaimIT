workflows:
  android-build:
    name: Essax Android Build
    instance_type: mac_mini_m2
    max_build_duration: 60

    environment:
      flutter: 3.35.7

    scripts:
      - name: Get Flutter packages
        script: flutter pub get

      - name: Build APK
        script: flutter build apk --release

    artifacts:
      - build/app/outputs/flutter-apk/app-release.apk